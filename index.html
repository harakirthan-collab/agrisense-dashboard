<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSense Live Hardware & Seed Advisor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #eab308;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: var(--accent-green);
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        select, button {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button:hover {
            background: var(--border);
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-sub);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .telemetry-item {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .telemetry-item .value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .status-banner {
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-on { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-off { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        .status-rain { background: rgba(234, 179, 8, 0.15); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }

        .crop-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        .crop-item {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .crop-item:last-child { border-bottom: none; }
        .badge-pass { color: var(--accent-green); font-weight: bold; }
        .badge-fail { color: var(--accent-red); font-weight: bold; }

        .voice-box {
            background: var(--bg-color);
            border-left: 4px solid var(--accent-green);
            padding: 15px;
            margin-top: 10px;
            font-style: italic;
            position: relative;
        }

        .speak-btn {
            margin-top: 10px;
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
        }

        .speak-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="welcome-title">--- AGRISENSE LIVE HARDWARE & SEED ADVISOR ---</h1>
    </div>

    <div class="controls">
        <label for="languageSelect"><strong>Language / ಭಾಷೆ / भाषा:</strong></label>
        <select id="languageSelect" onchange="updateDashboard()">
            <option value="1">English</option>
            <option value="2">Kannada (ಕನ್ನಡ)</option>
            <option value="3">Hindi (हिंदी)</option>
        </select>
        <button onclick="fetchSensorData()">🔄 Refresh Telemetry</button>
    </div>

    <!-- Telemetry Card -->
    <div class="card">
        <h2>FIELD TELEMETRY (ESP32 Live Channel)</h2>
        <div class="telemetry-grid">
            <div class="telemetry-item">
                <div class="text-sub">Field Temperature</div>
                <div class="value" id="val-temp">-- °C</div>
            </div>
            <div class="telemetry-item">
                <div class="text-sub">Air Humidity</div>
                <div class="value" id="val-humidity">-- %</div>
            </div>
            <div class="telemetry-item">
                <div class="text-sub" id="lbl-soil">Soil Moisture</div>
                <div class="value" id="val-soil">-- %</div>
            </div>
        </div>
    </div>

    <!-- Pump Control Card -->
    <div class="card">
        <h2>PUMP CONTROL STATUS</h2>
        <div id="pump-status-banner" class="status-banner status-off">
            Fetching status...
        </div>
    </div>

    <!-- Seed Advisory Card -->
    <div class="card">
        <h2 id="lbl-seed-title">🌱 SEED RECOMMENDATION BASED ON FIELD SENSORS:</h2>
        <ul class="crop-list" id="crop-results"></ul>
    </div>

    <!-- Voice Advisory Card -->
    <div class="card">
        <h2 id="lbl-voice-title">📢 VOICE ASSISTANT ADVISORY:</h2>
        <div class="voice-box" id="voice-script">Generating script...</div>
        <button class="speak-btn" onclick="speakAdvisory()">🔊 Read Advisory Aloud</button>
    </div>
</div>

<script>
    const THINGSPEAK_CHANNEL_ID = "3457086";

    const TRANSLATIONS = {
        "1": {
            "welcome": "--- AGRISENSE LIVE HARDWARE & SEED ADVISOR ---",
            "soil": "Soil Moisture",
            "pump_on": "🚨 PUMP ACTIVATED: Soil is dry and no rain detected.",
            "pump_off": "✅ PUMP OFF: Soil moisture is adequate.",
            "rain_hold": "🌧️ RAIN ALERT: Active rain detected in city! Pump locked.",
            "seed_title": "🌱 SEED RECOMMENDATION BASED ON FIELD SENSORS:",
            "voice_title": "📢 VOICE ASSISTANT ADVISORY:",
            "pass": "Optimal parameters met",
            "fail": "Parameters out of range",
            "lang_code": "en-US"
        },
        "2": {
            "welcome": "--- ಅಗ್ರಿಸೆನ್ಸ್ ಲೈವ್ ಹಾರ್ಡ್‌ವೇರ್ ಮತ್ತು ಬಿತ್ತನೆ ಸಹಾಯಕ ---",
            "soil": "ಮಣ್ಣಿನ ತೇವಾಂಶ",
            "pump_on": "🚨 ಪಂಪ್ ಚಾಲಿತವಾಗಿದೆ: ಮಣ್ಣು ಒಣಗಿದೆ ಮತ್ತು ಮಳೆ ಇಲ್ಲ.",
            "pump_off": "✅ ಪಂಪ್ ಆಫ್ ಆಗಿದೆ: ಮಣ್ಣಿನ ತೇವಾಂಶ ಸಾಕು.",
            "rain_hold": "🌧️ ಮಳೆಯ ಎಚ್ಚರಿಕೆ: ಮಳೆಯಾಗುತ್ತಿದೆ! ಪಂಪ್ ಬಂದ್ ಮಾಡಲಾಗಿದೆ.",
            "seed_title": "🌱 ಪ್ರಸ್ತುತ ಮಣ್ಣು ಮತ್ತು ವಾತಾವರಣಕ್ಕೆ ಸೂಕ್ತವಾದ ಬೀಜಗಳು:",
            "voice_title": "📢 ಧ್ವನಿ ಸಹಾಯಕ ವಾಚನ:",
            "pass": "ಸೂಕ್ತವಾದ ಸ್ಥಿತಿ ಉಂಟಾಗಿದೆ",
            "fail": "ಸೂಕ್ತವಾದ ವಾತಾವರಣವಿಲ್ಲ",
            "lang_code": "kn-IN"
        },
        "3": {
            "welcome": "--- एग्रीसेंस लाइव हार्डवेयर एवं बीज सलाहकार ---",
            "soil": "मिट्टी की नमी",
            "pump_on": "🚨 पंप चालू: मिट्टी सूखी है और बारिश नहीं है।",
            "pump_off": "✅ पंप बंद: मिट्टी में पर्याप्त नमी है।",
            "rain_hold": "🌧️ बारिश की चेतावनी: बारिश हो रही है! पंप बंद है।",
            "seed_title": "🌱 वर्तमान स्थिति के आधार पर अनुशंसित बीज:",
            "voice_title": "📢 वॉयस असिस्टेंट संदेश:",
            "pass": "अनुकूल परिस्थितियां पाई गईं",
            "fail": "मापदंड अनुकूल नहीं हैं",
            "lang_code": "hi-IN"
        }
    };

    const CROP_DATABASE = {
        "Arecanut (ಅಡಿಕೆ / सुपारी)": { min_temp: 20, max_temp: 35, min_soil: 50, max_soil: 80 },
        "Paddy / Rice (ಭತ್ತ / धान)": { min_temp: 20, max_temp: 38, min_soil: 70, max_soil: 95 },
        "Sugarcane (ಕಬ್ಬು / गन्ना)": { min_temp: 20, max_temp: 35, min_soil: 60, max_soil: 85 },
        "Maize (ಮೆಕ್ಕೆಜೋಳ / मक्का)": { min_temp: 18, max_temp: 32, min_soil: 40, max_soil: 70 },
        "Ragi (ರಾಗಿ / रागी)": { min_temp: 15, max_temp: 30, min_soil: 30, max_soil: 60 }
    };

    let sensorData = { temp: 28.5, humidity: 62.0, soil: 35.0 };
    let isRaining = false;
    let currentScript = "";

    async function fetchSensorData() {
        const url = `https://api.thingspeak.com/channels/${THINGSPEAK_CHANNEL_ID}/feeds.json?results=1`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            const lastEntry = data.feeds[data.feeds.length - 1];
            
            sensorData.temp = parseFloat(lastEntry.field1) || 28.5;
            sensorData.humidity = parseFloat(lastEntry.field2) || 62.0;
            sensorData.soil = parseFloat(lastEntry.field3) || 35.0;
        } catch (error) {
            console.warn("ThingSpeak offline or unreachable. Using cached/simulated data.");
        }
        updateDashboard();
    }

    function updateDashboard() {
        const langKey = document.getElementById("languageSelect").value;
        const lang = TRANSLATIONS[langKey];

        // Header and labels
        document.getElementById("welcome-title").innerText = lang["welcome"];
        document.getElementById("lbl-soil").innerText = lang["soil"];
        document.getElementById("lbl-seed-title").innerText = lang["seed_title"];
        document.getElementById("lbl-voice-title").innerText = lang["voice_title"];

        // Telemetry
        document.getElementById("val-temp").innerText = `${sensorData.temp} °C`;
        document.getElementById("val-humidity").innerText = `${sensorData.humidity} %`;
        document.getElementById("val-soil").innerText = `${sensorData.soil} %`;

        // Pump Control
        const banner = document.getElementById("pump-status-banner");
        let pumpStatusText = "";
        
        if (isRaining) {
            pumpStatusText = lang["rain_hold"];
            banner.className = "status-banner status-rain";
        } else if (sensorData.soil < 40) {
            pumpStatusText = lang["pump_on"];
            banner.className = "status-banner status-on";
        } else {
            pumpStatusText = lang["pump_off"];
            banner.className = "status-banner status-off";
        }
        banner.innerText = pumpStatusText;

        // Seed Advisory Engine
        const cropListContainer = document.getElementById("crop-results");
        cropListContainer.innerHTML = "";
        let recommendedSeeds = [];

        for (const [crop, limits] of Object.entries(CROP_DATABASE)) {
            const tempOk = sensorData.temp >= limits.min_temp && sensorData.temp <= limits.max_temp;
            const soilOk = sensorData.soil >= limits.min_soil && sensorData.soil <= limits.max_soil;
            const li = document.createElement("li");
            li.className = "crop-item";

            if (tempOk && soilOk) {
                recommendedSeeds.push(crop);
                li.innerHTML = `<span>✅ ${crop}</span><span class="badge-pass">${lang["pass"]}</span>`;
            } else {
                li.innerHTML = `<span>❌ ${crop}</span><span class="badge-fail">${lang["fail"]}</span>`;
            }
            cropListContainer.appendChild(li);
        }

        // Voice Script Generation
        if (recommendedSeeds.length > 0) {
            currentScript = `${pumpStatusText} ${lang["seed_title"]} ${recommendedSeeds.join(", ")}.`;
        } else {
            currentScript = `${pumpStatusText} Field parameters are currently outside ideal ranges for available crops.`;
        }
        document.getElementById("voice-script").innerText = `"${currentScript}"`;
    }

    function speakAdvisory() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const langKey = document.getElementById("languageSelect").value;
            const utterance = new SpeechSynthesisUtterance(currentScript);
            utterance.lang = TRANSLATIONS[langKey].lang_code;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Speech Synthesis is not supported in this browser.");
        }
    }

    // Initial Load
    fetchSensorData();
</script>

</body>
</html>
