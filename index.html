<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agrisense Dashboard</title>
  
  <!-- PWA Theme Settings -->
  <meta name="theme-color" content="#2e7d32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Embedded Web App Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Agrisense Dashboard",
    "short_name": "Agrisense",
    "start_url": "/agrisense-dashboard/",
    "scope": "/agrisense-dashboard/",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#2e7d32",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/628/628283.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "https://cdn-icons-png.flaticon.com/512/628/628283.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  }'>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 20px auto;
    }
    .btn-install {
      background-color: #2e7d32;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      display: none;
      margin: 10px auto;
    }
    .btn-install:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Agrisense IoT</h1>
    <p>Smart Agriculture Monitoring System</p>
    
    <!-- Install PWA Button -->
    <button id="installApp" class="btn-install">📱 Install App</button>
  </div>

  <script>
    // 1. Service Worker Registration (Embedded as Blob)
    const swCode = `
      const CACHE_NAME = 'agrisense-v1';
      self.addEventListener('install', (e) => {
        self.skipWaiting();
      });
      self.addEventListener('activate', (e) => {
        return self.clients.claim();
      });
      self.addEventListener('fetch', (e) => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;

    if ('serviceWorker' in navigator) {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      navigator.serviceWorker.register(swUrl, { scope: '/agrisense-dashboard/' })
        .then(() => console.log('Agrisense Service Worker Registered'))
        .catch(err => console.error('SW Registration Failed:', err));
    }

    // 2. Install Prompt Logic
    let deferredPrompt;
    const installBtn = document.getElementById('installApp');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('App Installed');
        }
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
