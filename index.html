<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agrisense IoT Dashboard</title>
  
  <!-- PWA Metadata -->
  <meta name="theme-color" content="#2e7d32" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Manifest Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Agrisense IoT Dashboard",
    "short_name": "Agrisense",
    "start_url": "/agrisense-dashboard/",
    "scope": "/agrisense-dashboard/",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#2e7d32",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/628/628283.png",
        "sizes": "192x192",
        "type": "image/png",
        "purpose": "any maskable"
      },
      {
        "src": "https://cdn-icons-png.flaticon.com/512/628/628283.png",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      }
    ]
  }'>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 20px auto;
    }
    .btn-install {
      background-color: #2e7d32;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: none;
      margin: 15px auto;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌱 Agrisense IoT</h1>
    <p>Smart Agriculture Monitoring</p>
    <button id="installApp" class="btn-install">📱 Install App</button>
  </div>

  <script>
    // 1. Register Dedicated Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered Successfully'))
        .catch(err => console.error('SW Error:', err));
    }

    // 2. Trigger PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installApp');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>
